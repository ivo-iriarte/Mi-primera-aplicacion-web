version: "2"

sql:
  - engine: "postgresql"
    schema: "./db/schema/"
    queries: "./db/queries/"
    gen:
      go:
        package: "db"
        out: "./db/sqlc/"
        sql_package: "database/sql"
        emit_json_tags: true
        overrides:
            - column: "cancha.hora_apertura"
              go_type: "string"
            - column: "cancha.hora_cierre"
              go_type: "string"