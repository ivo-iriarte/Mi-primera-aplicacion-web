services:
  database_test:
    image: postgres:18
    environment:
      POSTGRES_DB: CanchAppprueba
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: prueba
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U prueba -d CanchAppprueba
      interval: 2s
      timeout: 5s
      retries: 10