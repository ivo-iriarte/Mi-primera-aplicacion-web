services:
  database_test:
    image: postgres:18
    environment:
      POSTGRES_DB: CanchAppprueba
      POSTGRES_USER: prueba
      POSTGRES_PASSWORD: prueba
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        # El servidor temporal de inicialización solo acepta conexiones por socket.
        - pg_isready -h 127.0.0.1 -U prueba -d CanchAppprueba
      interval: 2s
      timeout: 5s
      retries: 10
